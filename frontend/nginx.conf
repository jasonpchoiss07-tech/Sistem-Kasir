server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback — all client routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and manifest should not be cached aggressively.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
